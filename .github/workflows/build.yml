# Builds REVENTOR Image Compressor for Windows, macOS and Linux.
# - Push a tag like v1.0.0  -> builds all three and attaches them to a GitHub Release
# - Manual run (Actions tab, "Run workflow") -> builds artifacts for testing
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: REVENTOR-Image-Compressor-Windows.exe
            binary: REVENTOR-Image-Compressor.exe
            icon: --icon icon.ico
          - os: macos-latest
            artifact: REVENTOR-Image-Compressor-macOS.dmg
            binary: REVENTOR-Image-Compressor
            icon: --icon icon.icns
          - os: ubuntu-22.04
            artifact: REVENTOR-Image-Compressor-Linux-AppImage
            binary: REVENTOR-Image-Compressor
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Linux runners need a few system libraries for Qt
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1

      - name: Install Python dependencies
        run: pip install Pillow pillow-heif pillow-jxl-plugin PySide6 resvg-py pyinstaller

      - name: Generate macOS icns icon
        if: runner.os == 'macOS'
        run: |
          python -c "from PIL import Image; img = Image.open('packaging/reventor-logo.png').convert('RGBA'); img.resize((512,512)).save('icon.icns', sizes=[(512,512),(256,256),(128,128),(64,64),(32,32),(16,16)])"

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name REVENTOR-Image-Compressor ${{ matrix.icon }}
          --additional-hooks-dir hooks
          --add-data "fonts${{ runner.os == 'Windows' && ';' || ':' }}fonts"
          --add-data "qmlapp/qml${{ runner.os == 'Windows' && ';' || ':' }}qmlapp/qml"
          --add-data "assets${{ runner.os == 'Windows' && ';' || ':' }}assets"
          --exclude-module numpy
          formatix.py

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist_out dmg_staging
          cp -r "dist/REVENTOR-Image-Compressor.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "REVENTOR Image Compressor"             -srcfolder dmg_staging -ov -format UDZO             "dist_out/REVENTOR-Image-Compressor-macOS.dmg"

      - name: Package Linux archive with installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist_out pkg
          cp dist/REVENTOR-Image-Compressor pkg/
          chmod +x pkg/REVENTOR-Image-Compressor
          cp packaging/reventor-image-compressor.desktop pkg/
          cp packaging/reventor-logo.png pkg/reventor.png
          cat > pkg/install.sh <<'EOS'
          #!/bin/bash
          set -e
          sudo cp REVENTOR-Image-Compressor /usr/local/bin/
          sudo mkdir -p /usr/share/icons/hicolor/256x256/apps
          sudo cp reventor.png /usr/share/icons/hicolor/256x256/apps/reventor-image-compressor.png
          mkdir -p ~/.local/share/applications
          sed 's|/opt/reventor|/usr/local/bin|; s|reventor.png|/usr/share/icons/hicolor/256x256/apps/reventor-image-compressor.png|'             reventor-image-compressor.desktop > ~/.local/share/applications/reventor-image-compressor.desktop
          echo "Installed. Find 'REVENTOR Image Compressor' in your application menu, or run: REVENTOR-Image-Compressor"
          EOS
          chmod +x pkg/install.sh
          tar -czf dist_out/REVENTOR-Image-Compressor-Linux.tar.gz -C pkg .

      - name: Build Linux AppImage (onedir)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name REVENTOR-Image-Compressor
          --additional-hooks-dir hooks
          --add-data "fonts:fonts"
          --add-data "qmlapp/qml:qmlapp/qml"
          --add-data "assets:assets"
          --exclude-module numpy
          formatix.py

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sL -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p AppDir
          cp -r dist/REVENTOR-Image-Compressor/* AppDir/
          cat > AppDir/reventor-image-compressor.desktop <<'EOS'
          [Desktop Entry]
          Type=Application
          Name=REVENTOR Image Compressor
          GenericName=Image Converter
          Comment=Batch convert, resize, and compress images
          Exec=REVENTOR-Image-Compressor
          Icon=reventor-logo
          Terminal=false
          Categories=Graphics;Utility;
          EOS
          cp packaging/reventor-logo.png AppDir/reventor-logo.png
          ln -sf reventor-logo.png AppDir/.DirIcon
          cat > AppDir/AppRun <<'EOS'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "${HERE}/REVENTOR-Image-Compressor" "$@"
          EOS
          chmod +x AppDir/AppRun
          ./appimagetool.AppImage --appimage-extract-and-run AppDir             REVENTOR-Image-Compressor-x86_64.AppImage
          mv REVENTOR-Image-Compressor-x86_64.AppImage dist_out/

      - name: Rename artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist_out
          mv dist/REVENTOR-Image-Compressor.exe "dist_out/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist_out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist_out

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
