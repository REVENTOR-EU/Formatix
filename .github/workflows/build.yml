# Builds REVENTOR Image Compressor for Windows, macOS and Linux.
# - Push a tag like v1.0.0  -> builds all three and attaches them to a GitHub Release
# - Manual run (Actions tab, "Run workflow") -> builds artifacts for testing
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: REVENTOR-Image-Compressor-Windows.exe
            binary: REVENTOR-Image-Compressor.exe
            icon: --icon icon.ico
          - os: macos-latest
            artifact: REVENTOR-Image-Compressor-macOS
            binary: REVENTOR-Image-Compressor
            icon: ""
          - os: ubuntu-22.04
            artifact: REVENTOR-Image-Compressor-Linux
            binary: REVENTOR-Image-Compressor
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Linux runners need a few system libraries for Qt
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1

      - name: Install Python dependencies
        run: pip install Pillow pillow-heif pillow-jxl-plugin PySide6 resvg-py pyinstaller

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name REVENTOR-Image-Compressor ${{ matrix.icon }}
          --additional-hooks-dir hooks
          --add-data "fonts${{ runner.os == 'Windows' && ';' || ':' }}fonts"
          --add-data "qmlapp/qml${{ runner.os == 'Windows' && ';' || ':' }}qmlapp/qml"
          --add-data "assets${{ runner.os == 'Windows' && ';' || ':' }}assets"
          --exclude-module numpy
          formatix.py

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist_out
          if [ -f "dist/REVENTOR-Image-Compressor.exe" ]; then
            mv dist/REVENTOR-Image-Compressor.exe "dist_out/${{ matrix.artifact }}"
          else
            mv dist/REVENTOR-Image-Compressor "dist_out/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist_out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist_out

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
